[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-sync"
version = "0.1.0"
description = "Zero-dependency bidirectional git mirror and failover orchestrator across GitHub, Forgejo, GitLab, and Gitea."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "HUMMBL", email = "238336761+hummbl-dev@users.noreply.github.com" }
]
keywords = ["git", "mirror", "forgejo", "github", "gitlab", "sovereignty", "failover", "multi-forge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
forge-sync = "forge_sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_sync*"]
